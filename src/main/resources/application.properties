spring.application.name=tecnicoya-api
server.port=${SERVER_PORT:8080}

# --- Conexión a MySQL ---------------------------------------------------
# Los valores por defecto (root/root) son solo para desarrollo local.
# Sobrescríbalos con DB_URL, DB_USER y DB_PASSWORD, ya sea como variables de
# entorno o en el archivo .env de la raíz del proyecto (ver .env.example).
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tecnicoya_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# --- JPA / Hibernate ----------------------------------------------------
# El esquema se crea con database/schema.sql; Hibernate solo lo valida.
spring.jpa.hibernate.ddl-auto=validate
# Respeta tal cual los nombres de @Table/@Column (p. ej. idUsuario, tipo_usuario)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Los scripts SQL se ejecutan manualmente; Spring no debe cargarlos.
spring.sql.init.mode=never

# --- Token JWT ----------------------------------------------------------
# Clave con la que se firman los tokens (mínimo 32 caracteres). El valor por defecto es solo
# para desarrollo local: en otro entorno defina JWT_SECRET en el .env o como variable de entorno.
tecnicoya.jwt.secreto=${JWT_SECRET:tecnicoya-clave-de-desarrollo-cambiela-en-produccion}
# Horas de validez del token; al vencer, el usuario debe iniciar sesión otra vez.
tecnicoya.jwt.horas-validez=${JWT_HORAS_VALIDEZ:8}

# --- Archivos subidos (evidencias y comprobantes de pago) ----------------
# Carpeta donde se guardan; si es relativa, se crea dentro de la carpeta desde la que se inicia la API.
tecnicoya.archivos.directorio=${ARCHIVOS_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Ante un archivo más grande, Tomcat lee y descarta hasta 50 MB del cuerpo para poder responder el error 413;
# con el valor por defecto (2 MB) cortaría la conexión y el cliente no recibiría el mensaje.
server.tomcat.max-swallow-size=50MB

# --- Logs (Logback) -----------------------------------------------------
# Los destinos, niveles y rotación se configuran en logback-spring.xml.
# Carpeta de los archivos de log (tecnicoya-api.log y auditoria.log).
tecnicoya.logs.directorio=${LOGS_DIR:logs}

# --- Seguridad ----------------------------------------------------------
# Intentos fallidos de inicio de sesión permitidos (por correo e IP) y minutos de bloqueo tras superarlos.
tecnicoya.login.max-intentos=${LOGIN_MAX_INTENTOS:5}
tecnicoya.login.minutos-bloqueo=${LOGIN_MINUTOS_BLOQUEO:15}
# Orígenes del front-end que pueden llamar a la API desde el navegador (separados por comas).
tecnicoya.cors.origenes=${CORS_ORIGENES:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
# Las respuestas de error nunca muestran la traza ni detalles internos del servidor.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false
# HTTPS: en producción, active SSL con un certificado propio (o publique la API detrás de un proxy con HTTPS):
# server.ssl.enabled=true
# server.ssl.key-store=classpath:tecnicoya.p12
# server.ssl.key-store-password=${SSL_PASSWORD}
# server.ssl.key-store-type=PKCS12

# --- Monitoreo: Actuator + Micrometer + Prometheus (guía: docs/monitoreo.md) ---
# Endpoints publicados en /actuator. No se publican env, beans, heapdump ni otros que muestran datos internos.
# Los protege MonitoreoSeguridadFilter: health es público y el resto exige un token de ADMINISTRADOR.
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers
# Un anónimo solo ve {"status":"UP"}; el administrador ve además la BD, el disco y el ping.
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMINISTRADOR
# /actuator/info: versión de Java, sistema operativo y datos del proceso.
management.info.java.enabled=true
management.info.os.enabled=true
management.info.process.enabled=true
# Token fijo de solo lectura para que Prometheus consulte /actuator/prometheus sin iniciar sesión.
# Vacío = desactivado (solo entra el administrador con su JWT). Defínalo con MONITOREO_TOKEN en el .env.
tecnicoya.monitoreo.token=${MONITOREO_TOKEN:}
# Etiqueta común en todas las métricas, para distinguir esta API en Grafana.
management.metrics.tags.application=${spring.application.name}
# APM: histograma de los tiempos de respuesta de cada endpoint (Grafana calcula con él los percentiles p95 y p99)
# y umbrales para contar las peticiones lentas.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,500ms,1s
# Métricas de Tomcat: hilos ocupados, sesiones y bytes enviados/recibidos por la API (tráfico de red).
server.tomcat.mbeanregistry.enabled=true
# Monitoreo de la BD: estadísticas de Hibernate (consultas, entidades, transacciones) y aviso en el log de
# cada consulta SQL que tarde más de SQL_LENTA_MS milisegundos (logger org.hibernate.SQL_SLOW).
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.log_slow_query=${SQL_LENTA_MS:500}
# Logs estructurados (logs/tecnicoya-api.json, formato ECS): datos del servicio que se agregan a cada evento.
logging.structured.ecs.service.name=${spring.application.name}
logging.structured.ecs.service.version=@project.version@
logging.structured.ecs.service.environment=${ENTORNO:desarrollo}
