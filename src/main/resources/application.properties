spring.application.name=tecnicoya-api
server.port=${SERVER_PORT:8080}

spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tecnicoya_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.sql.init.mode=never

tecnicoya.jwt.secreto=${JWT_SECRET:tecnicoya-clave-de-desarrollo-cambiela-en-produccion}
tecnicoya.jwt.horas-validez=${JWT_HORAS_VALIDEZ:8}

tecnicoya.archivos.directorio=${ARCHIVOS_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.tomcat.max-swallow-size=50MB

tecnicoya.logs.directorio=${LOGS_DIR:logs}

tecnicoya.login.max-intentos=${LOGIN_MAX_INTENTOS:5}
tecnicoya.login.minutos-bloqueo=${LOGIN_MINUTOS_BLOQUEO:15}
tecnicoya.cors.origenes=${CORS_ORIGENES:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMINISTRADOR
management.info.java.enabled=true
management.info.os.enabled=true
management.info.process.enabled=true
tecnicoya.monitoreo.token=${MONITOREO_TOKEN:}
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,500ms,1s
server.tomcat.mbeanregistry.enabled=true
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.log_slow_query=${SQL_LENTA_MS:500}
logging.structured.ecs.service.name=${spring.application.name}
logging.structured.ecs.service.version=@project.version@
logging.structured.ecs.service.environment=${ENTORNO:desarrollo}
