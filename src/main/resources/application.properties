spring.application.name=tecnicoya-api
server.port=${SERVER_PORT:8080}

# --- Conexión a MySQL ---------------------------------------------------
# Los valores por defecto (root/root) son solo para desarrollo local.
# Sobrescríbalos con DB_URL, DB_USER y DB_PASSWORD, ya sea como variables de
# entorno o en el archivo .env de la raíz del proyecto (ver .env.example).
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tecnicoya_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# --- JPA / Hibernate ----------------------------------------------------
# El esquema se crea con database/schema.sql; Hibernate solo lo valida.
spring.jpa.hibernate.ddl-auto=validate
# Respeta tal cual los nombres de @Table/@Column (p. ej. idUsuario, tipo_usuario)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Los scripts SQL se ejecutan manualmente; Spring no debe cargarlos.
spring.sql.init.mode=never

# --- Archivos subidos (evidencias y comprobantes de pago) ----------------
# Carpeta donde se guardan; si es relativa, se crea dentro de la carpeta desde la que se inicia la API.
tecnicoya.archivos.directorio=${ARCHIVOS_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Ante un archivo más grande, Tomcat lee y descarta hasta 50 MB del cuerpo para poder responder el error 413;
# con el valor por defecto (2 MB) cortaría la conexión y el cliente no recibiría el mensaje.
server.tomcat.max-swallow-size=50MB
