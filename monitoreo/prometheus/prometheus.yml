# Prometheus consulta las métricas de la API cada 15 segundos y evalúa las alertas de alertas.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: tecnicoya-api
    metrics_path: /actuator/prometheus
    # Token de solo lectura (tecnicoya.monitoreo.token / MONITOREO_TOKEN en la API); ver MonitoreoSeguridadFilter
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/token.txt
    static_configs:
      # host.docker.internal = la PC donde corre la API. Cambie el puerto si usa otro SERVER_PORT.
      - targets: ["host.docker.internal:8080"]
